<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Notifications - CMS</title>
    <link rel="stylesheet" href="../../css/Admin/admin-common.css" />
  </head>

  <body>
    <header class="dashboard-header">
      <div class="logo-area">
        <h1>CMS</h1>
        <span>Complaint Management System</span>
      </div>

      <div class="admin-area">
        <span id="adminName"></span>
        <button id="logoutButton" type="button">Logout</button>
      </div>
    </header>

    <div class="dashboard-layout">
      <aside class="sidebar">
        <nav class="sidebar-nav">
          <a href="dashboard.html" class="nav-link">Dashboard</a>
          <a href="departments.html" class="nav-link">Departments</a>
          <a href="authority.html" class="nav-link">Higher Authority</a>
          <a href="categories.html" class="nav-link">Categories</a>
          <a href="complaints.html" class="nav-link">Complaints</a>
          <a href="feedback.html" class="nav-link">Feedback</a>
          <a href="users.html" class="nav-link">Users</a>
          <a href="notifications.html" class="nav-link active">Notifications <span class="nav-badge" id="notifBadge" hidden></span></a>
        </nav>
      </aside>

      <main class="main-content">
        <section class="welcome-section">
          <h2>Notifications</h2>
          <p>Latest 50 notifications. Click one to open the complaint.</p>
        </section>

        <section class="card">
          <div class="toolbar" style="justify-content:space-between">
            <div class="tabs" style="margin-bottom:0">
              <button type="button" class="tab active" data-filter="all">All</button>
              <button type="button" class="tab" data-filter="unread">Unread</button>
            </div>
            <button type="button" id="markAllReadButton" class="btn btn-secondary">Mark all as read</button>
          </div>
          <ul class="notif-list" id="notificationList"></ul>
        </section>

      </main>
    </div>

    <script src="../../JS/Admin/admin-common.js"></script>
    <script src="../../JS/Admin/admin-profile.js"></script>
    <script src="../../JS/Admin/notification.js"></script>
  </body>
</html>
