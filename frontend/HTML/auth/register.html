<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#B9E6D3" />
    <meta
      name="description"
      content="Create a Student or Staff account for the Complaint Management System."
    />

    <title>CMS | Register Account</title>

    <link rel="icon" type="image/svg+xml" href="../../assets/cms-logo.svg" />

    <link rel="stylesheet" href="../../css/auth/register.css" />
  </head>

  <body>
    <a class="skip-link" href="#registerForm"> Skip to registration form </a>

    <main class="register-frame">
      <!-- Header -->
      <!-- Header -->
      <header class="site-header">
        <a class="brand" href="index.html" aria-label="CMS Home">
          <img
            src="../../assets/cms-logo.svg"
            alt="CMS - Complaint Management System"
            class="brand-logo"
          />
        </a>
      </header>

      <!-- Main registration layout -->
      <div class="register-layout">
        <!-- Left introduction panel -->
        <section class="intro-panel" aria-labelledby="introTitle">
          <div class="intro-copy">
            <p class="eyebrow">START YOUR JOURNEY</p>

            <h1 id="introTitle">
              Create Your
              <span>Account</span>
            </h1>

            <span class="yellow-rule" aria-hidden="true"></span>

            <p class="intro-description">
              Register to report complaints, track progress, and receive updates
              from your institution in one place.
            </p>
          </div>

          <div class="intro-art">
            <img
              src="../../assets/cms-hero-illustration.svg"
              alt="Illustration of a complaint card with a resolved checkmark, a notification bell and a progress tracker"
            />
          </div>
        </section>

        <!-- Registration card -->
        <section class="registration-card" aria-labelledby="registerHeading">
          <div class="card-brand">
            <img src="../../assets/cms-logo.svg" alt="CMS Logo" />
          </div>

          <h2 id="registerHeading">Register Account</h2>

          <p class="card-subtitle">
            Choose your role and fill in the required details.
          </p>

          <!-- Student / Staff toggle -->
          <div class="role-switch" role="group" aria-label="Register as">
            <button
              class="role-option active"
              id="studentRoleButton"
              type="button"
              data-role="Student"
              aria-pressed="true"
            >
              <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                <path d="m2 9 10-5 10 5-10 5L2 9Z"></path>
                <path d="M6 11v5c3.5 3 8.5 3 12 0v-5M22 9v6"></path>
              </svg>

              <span>Student</span>
            </button>

            <button
              class="role-option"
              id="staffRoleButton"
              type="button"
              data-role="Staff"
              aria-pressed="false"
            >
              <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                <rect x="3" y="7" width="18" height="13" rx="2"></rect>
                <path d="M9 7V4h6v3M3 12h18M10 12v2h4v-2"></path>
              </svg>

              <span>Staff</span>
            </button>
          </div>

          <!-- Registration form -->
          <form id="registerForm" novalidate>
            <div class="form-fields">
              <!-- Full name -->
              <div class="input-row">
                <svg class="field-icon" viewBox="0 0 24 24" aria-hidden="true">
                  <circle cx="12" cy="8" r="4"></circle>
                  <path d="M4 21v-2a8 8 0 0 1 16 0v2Z"></path>
                </svg>

                <label class="visually-hidden" for="name"> Full Name </label>

                <input
                  id="name"
                  name="name"
                  type="text"
                  maxlength="100"
                  placeholder="Full Name *"
                  autocomplete="name"
                  required
                />
              </div>

              <!-- Email -->
              <div class="input-row">
                <svg class="field-icon" viewBox="0 0 24 24" aria-hidden="true">
                  <rect x="3" y="5" width="18" height="14" rx="2"></rect>
                  <path d="m4 7 8 6 8-6"></path>
                </svg>

                <label class="visually-hidden" for="email"> Email </label>

                <input
                  id="email"
                  name="email"
                  type="email"
                  maxlength="150"
                  placeholder="Email *"
                  autocomplete="email"
                  required
                />
              </div>

              <!-- Student-only: PRN -->
              <div class="input-row student-only" id="prnRow">
                <svg class="field-icon" viewBox="0 0 24 24" aria-hidden="true">
                  <path d="m2 9 10-5 10 5-10 5L2 9Z"></path>
                  <path d="M6 11v5c3.5 3 8.5 3 12 0v-5M22 9v6"></path>
                </svg>

                <label class="visually-hidden" for="prn"> PRN </label>

                <input
                  id="prn"
                  name="prn"
                  type="text"
                  maxlength="20"
                  placeholder="PRN *"
                  autocomplete="off"
                  required
                />
              </div>

              <!-- Staff-only: Employee Number -->
              <div class="input-row staff-only" id="employeeNoRow" hidden>
                <svg class="field-icon" viewBox="0 0 24 24" aria-hidden="true">
                  <rect x="3" y="4" width="18" height="16" rx="2"></rect>
                  <circle cx="9" cy="10" r="2"></circle>
                  <path
                    d="M5.5 16c.5-2 1.7-3 3.5-3s3 1 3.5 3M15 9h3M15 13h3M15 16h3"
                  ></path>
                </svg>

                <label class="visually-hidden" for="employee_no">
                  Employee Number
                </label>

                <input
                  id="employee_no"
                  name="employee_no"
                  type="text"
                  maxlength="10"
                  placeholder="Employee Number *"
                  autocomplete="off"
                />
              </div>

              <!-- Department -->
              <!-- Department -->
              <div class="input-row select-row">
                <svg class="field-icon" viewBox="0 0 24 24" aria-hidden="true">
                  <path
                    d="M3 21h18M5 21V5h10v16M15 10h4v11M8 8h4M8 12h4M8 16h4M17 14h1M17 17h1"
                  ></path>
                </svg>

                <label class="visually-hidden" for="department"
                  >Department</label
                >

                <select id="department" name="department_id" required disabled>
                  <option value="">Loading departments…</option>
                </select>

                <span class="select-caret" aria-hidden="true">
                  <svg viewBox="0 0 24 24">
                    <path d="m6 9 6 6 6-6"></path>
                  </svg>
                </span>
              </div>

              <!-- Staff-only: Designation -->
              <div class="input-row staff-only" id="designationRow" hidden>
                <svg class="field-icon" viewBox="0 0 24 24" aria-hidden="true">
                  <rect x="3" y="7" width="18" height="14" rx="2"></rect>
                  <path d="M8 7V4h8v3M3 12h18M10 12v2h4v-2"></path>
                </svg>

                <label class="visually-hidden" for="designation">
                  Designation
                </label>

                <input
                  id="designation"
                  name="designation"
                  type="text"
                  maxlength="50"
                  placeholder="Designation *"
                  autocomplete="organization-title"
                />
              </div>

              <!-- Password -->
              <div class="input-row password-row">
                <svg class="field-icon" viewBox="0 0 24 24" aria-hidden="true">
                  <rect x="4" y="10" width="16" height="11" rx="2"></rect>
                  <path d="M8 10V7a4 4 0 0 1 8 0v3M12 14v3"></path>
                </svg>

                <label class="visually-hidden" for="password"> Password </label>

                <input
                  id="password"
                  name="password"
                  type="password"
                  minlength="8"
                  maxlength="72"
                  placeholder="Password (min 8 characters) *"
                  autocomplete="new-password"
                  required
                />

                <button
                  class="password-toggle"
                  type="button"
                  data-target="password"
                  aria-label="Show password"
                  aria-pressed="false"
                >
                  <svg viewBox="0 0 24 24" aria-hidden="true">
                    <path
                      d="M2 12s3.6-6 10-6 10 6 10 6-3.6 6-10 6S2 12 2 12Z"
                    ></path>
                    <circle cx="12" cy="12" r="3"></circle>
                  </svg>
                </button>
              </div>

              <!-- Confirm Password -->
              <div class="input-row password-row">
                <svg class="field-icon" viewBox="0 0 24 24" aria-hidden="true">
                  <rect x="4" y="10" width="16" height="11" rx="2"></rect>
                  <path d="M8 10V7a4 4 0 0 1 8 0v3M12 14v3"></path>
                </svg>

                <label class="visually-hidden" for="confirmPassword">
                  Confirm Password
                </label>

                <input
                  id="confirmPassword"
                  name="confirmPassword"
                  type="password"
                  minlength="8"
                  maxlength="72"
                  placeholder="Confirm Password *"
                  autocomplete="new-password"
                  required
                />

                <button
                  class="password-toggle"
                  type="button"
                  data-target="confirmPassword"
                  aria-label="Show confirm password"
                  aria-pressed="false"
                >
                  <svg viewBox="0 0 24 24" aria-hidden="true">
                    <path
                      d="M2 12s3.6-6 10-6 10 6 10 6-3.6 6-10 6S2 12 2 12Z"
                    ></path>
                    <circle cx="12" cy="12" r="3"></circle>
                  </svg>
                </button>
              </div>
            </div>

            <!-- Success and error messages -->
            <p
              id="message"
              class="form-message"
              role="status"
              aria-live="polite"
            ></p>

            <!-- Submit -->
            <button class="submit-button" id="registerButton" type="submit">
              Register as Student
            </button>
          </form>

          <p class="login-prompt">
            Already have an account?
            <a href="login.html">Login here</a>
          </p>
        </section>
      </div>
    </main>

    <script src="../../JS/auth/register.js" defer></script>
  </body>
</html>
