<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Submit Complaint - CMS</title>
    <link rel="stylesheet" href="../../css/Student/student-common.css" />
  </head>

  <body>
    <header class="dashboard-header">
      <div class="logo-area">
        <h1>CMS</h1>
        <span>Complaint Management System</span>
      </div>

      <div class="admin-area">
        <a id="userName" href="profile.html" title="My Profile"></a>
        <button id="logoutButton" type="button">Logout</button>
      </div>
    </header>

    <div class="dashboard-layout">
      <aside class="sidebar">
        <nav class="sidebar-nav">
          <a href="dashboard.html" class="nav-link">Dashboard</a>
          <a href="submit-complaint.html" class="nav-link active">Submit Complaint</a>
          <a href="complaints.html" class="nav-link">My Complaints</a>
          <a href="profile.html" class="nav-link">My Profile</a>
          <a href="notifications.html" class="nav-link">Notifications <span class="nav-badge" id="notifBadge" hidden></span></a>
        </nav>
      </aside>

      <main class="main-content">
        <section class="welcome-section">
          <h2>Submit Complaint</h2>
          <p>Tell us the problem. You can track it from My Complaints.</p>
        </section>

        <section class="card" id="formCard">
          <form id="complaintForm" novalidate>
            <div class="form-grid">
              <div class="form-group full">
                <label>Complaint Type</label>
                <div class="type-options">
                  <label class="type-option selected">
                    <input type="radio" name="complaint_type" value="NORMAL" checked />
                    <div><strong>Normal Complaint</strong><span>Choose a category. It goes to that category's department.</span></div>
                  </label>
                  <label class="type-option">
                    <input type="radio" name="complaint_type" value="EXAMINATION" />
                    <div><strong>Examination Complaint</strong><span>Marks, results, exam issues. It goes to your own department.</span></div>
                  </label>
                </div>
              </div>

              <div class="form-group full" id="categoryGroup">
                <label for="category">Category</label>
                <select id="category" required>
                  <option value="" selected disabled>Select category</option>
                </select>
              </div>

              <div class="form-group full">
                <label for="subject">Subject</label>
                <input type="text" id="subject" maxlength="255" placeholder="Short title of your complaint" />
                <span class="char-hint" id="subjectCount">0 / 255</span>
              </div>

              <div class="form-group full">
                <label for="description">Description</label>
                <textarea id="description" rows="6" placeholder="Explain the problem clearly: what happened, where and when."></textarea>
              </div>

              <div class="form-group">
                <label for="priority">Priority</label>
                <select id="priority">
                  <option value="LOW">Low</option>
                  <option value="MEDIUM" selected>Medium</option>
                  <option value="HIGH">High</option>
                  <option value="URGENT">Urgent</option>
                </select>
              </div>

              <div class="form-group">
                <label for="attachment">Attachment link (optional)</label>
                <input type="text" id="attachment" maxlength="255" placeholder="https://drive.google.com/..." />
              </div>
            </div>

            <p class="field-error" id="formError"></p>
            <div class="page-actions" style="margin:8px 0 0">
              <button type="submit" class="btn btn-primary" id="submitButton">Submit Complaint</button>
              <a class="btn btn-secondary" href="complaints.html">Cancel</a>
            </div>
          </form>
        </section>

        <section class="card success-card" id="successCard" hidden>
          <h3>Complaint submitted</h3>
          <div class="big-id" id="newComplaintId"></div>
          <p id="newComplaintStatus"></p>
          <p id="successNote"></p>
          <div class="page-actions">
            <a class="btn btn-primary" id="viewComplaintLink" href="complaints.html">View Complaint</a>
            <button type="button" class="btn btn-secondary" id="submitAnotherButton">Submit Another</button>
          </div>
        </section>

      </main>
    </div>

    <script src="../../JS/Student/student-common.js"></script>
    <script src="../../JS/Student/submit-complaint.js"></script>
  </body>
</html>
