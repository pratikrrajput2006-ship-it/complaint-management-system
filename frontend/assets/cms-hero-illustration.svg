    <!-- check badge -->
    <circle cx="318" cy="318" r="50" fill="#171C19" stroke="none" transform="translate(6 6)"/>
    <circle cx="318" cy="318" r="50" fill="#B9E6D3"/>
    <path d="M294 318l17 17 32-36" fill="none" stroke-width="8"/>

    <!-- bell -->
    <rect x="404" y="244" width="110" height="110" fill="#171C19" stroke="none" transform="translate(8 8)"/>
