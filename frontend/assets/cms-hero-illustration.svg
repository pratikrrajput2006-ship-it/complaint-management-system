<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 440" role="img" aria-label="Complaint card with a status checkmark, a notification bell and a progress tracker">
  <g stroke="#171C19" stroke-width="4" stroke-linejoin="round" stroke-linecap="round">
    <!-- tracker card (back) -->
    <rect x="300" y="40" width="220" height="150" fill="#171C19" stroke="none" transform="translate(8 8)"/>
    <rect x="300" y="40" width="220" height="150" fill="#D9EBFA"/>
    <path d="M326 76h120M326 100h168M326 124h90" fill="none"/>
    <circle cx="334" cy="158" r="10" fill="#B9E6D3"/>
    <circle cx="380" cy="158" r="10" fill="#FBE4C7"/>
    <circle cx="426" cy="158" r="10" fill="#FFFDF8"/>
    <path d="M344 158h26M390 158h26" fill="none"/>

    <!-- main complaint card -->
    <rect x="50" y="110" width="270" height="250" fill="#171C19" stroke="none" transform="translate(10 10)"/>
    <rect x="50" y="110" width="270" height="250" fill="#FFFDF8"/>
    <rect x="50" y="110" width="270" height="52" fill="#B9E6D3"/>
    <path d="M78 136h90" fill="none" stroke-width="6"/>
