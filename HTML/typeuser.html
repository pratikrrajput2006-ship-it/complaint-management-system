<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
      }

      body {
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        margin: auto;
      }
      div {
        display: flex;
        flex-direction: column;
        gap: 20px;
        height: 50vh;
        background-color:#fff;
        justify-content: center;
        width: 350px;
        position: relative;
        border-radius: 10px;
        box-shadow:
          rgba(0, 0, 0, 0.16) 0px 3px 6px,
          rgba(0, 0, 0, 0.23) 0px 3px 6px;
          text-align: center;
      }
      button {
        width: 200px;
        padding: 20px 30px;
        margin: 20px;
        border-radius: 5px;
        border: none;
        box-shadow:
          rgba(0, 0, 0, 0.16) 0px 3px 6px,
          rgba(0, 0, 0, 0.23) 0px 3px 6px;
        font-size: 20px;
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
      }
      p {
        width: 100%;
        margin: 20px auto;
        position: absolute;
        top: 10px;
        font-size: 20px;

      }
      a {
        text-decoration: none;
        color: #000;
      }
    </style>
  </head>
  <body>
    <div>
      <p>Select your Catagory</p>
      <a href="/HTML/login.HTML"><button>Student</button></a>
      <a href="/HTML/login.HTML"><button>Staff</button></a>
    </div>
  </body>
</html>
