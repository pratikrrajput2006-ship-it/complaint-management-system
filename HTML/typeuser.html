<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
      }

      body {
        display: flex;
        flex-direction:column;
        justify-content: center;
        align-items: center;
        height: 100vh;
        margin: auto;
        position: relative;
      }
#one{
  position: absolute;
  top: 0;
  display: flex;
  gap: 20px;
  top: 5px;
  width: 100vw;
  margin: 10px;
  height: 50px;
}
#one p{
  margin: auto;
  font-size: 18px;
  color: #333;
}
#one p a{
  color: #333;
  text-decoration: none;
  padding:10px 20px;
  border-radius: 10px;
  background-color: skyblue;
  color: #fff;
  margin-left: 20px;
  font-size: 18px;
  
}

      #two {
        display: flex;
        flex-direction: column;
        gap: 20px;
        height: 50vh;
        background-color:#fff;
        justify-content: center;
        width: 350px;
        position: relative;
        border-radius: 10px;
        box-shadow:
          rgba(0, 0, 0, 0.16) 0px 3px 6px,
          rgba(0, 0, 0, 0.23) 0px 3px 6px;
          text-align: center;
      }
      button {
        width: 200px;
        padding: 20px 30px;
        margin: 20px;
        border-radius: 5px;
        border: none;
        box-shadow:
          rgba(0, 0, 0, 0.16) 0px 3px 6px,
          rgba(0, 0, 0, 0.23) 0px 3px 6px;
        font-size: 20px;
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
      }
      #two p {
        width: 100%;
        margin: 20px auto;
        position: absolute;
        top: 10px;
        font-size: 20px;

      }
      #two a {
        text-decoration: none;
        color: #000;
      }

    </style>
  </head>
  <body>
    <div id="one">
      <p>Already you have a account only sign in and use it.<a href="/HTML/login.HTML">Sign in</a></p>
      
    </div>
    <div id="two">
      <p>Select your Catagory</p>
      <a href="/HTML/login.HTML"><button>Student</button></a>
      <a href="/HTML/login.HTML"><button>Staff</button></a>
    </div>
  </body>
</html>
