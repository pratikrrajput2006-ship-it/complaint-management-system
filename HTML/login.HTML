<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="stylesheet" href="/css/login.css">

</head>
<body>

    <div class="login-container">
        <h2>Account Login</h2>
        <form id="loginForm" onsubmit="return validateForm(event)">
            
            <!-- Email Field -->
            <div class="form-group">
                <label for="email">Email Address</label>
                <input type="email" id="email" required placeholder="name@example.com">
                <div id="emailError" class="error-message">Please enter a valid email address.</div>
            </div>

            <!-- Password Field -->
            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" required placeholder="••••••••">
                <div id="passwordError" class="error-message">Password must be at least 6 characters long.</div>
            </div>

            <!-- Submit Button -->
            <button type="submit">Sign In</button>
            
            <br>
        </form>
        <p>OR</p>
        <form action="" onsubmit="return hello(event)">
             <div class="form-group">
                <label for="PRN">PRN</label>
                <input type="number" id="PRN" required placeholder="10 Digit PRN">
                <div id="PRNError" class="error-message">PRN must be at least 10 characters long.</div>
            </div>
            <button type="submit">Sign In</button>
        </form>
    </div>

    <script>
        function validateForm(event) {
            // Prevent actual form submission to handle validation first
            event.preventDefault();

            let isValid = true;
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            
            const emailError = document.getElementById('emailError');
            const passwordError = document.getElementById('passwordError');

            // Simple client-side regex check for email format
            const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
            if (!emailRegex.test(email)) {
                emailError.style.display = 'block';
                isValid = false;
            } else {
                emailError.style.display = 'none';
            }

            // Simple client-side password length check
            if (password.length < 6) {
                passwordError.style.display = 'block';
                isValid = false;
            } else {
                passwordError.style.display = 'none';
            }

            if (isValid) {
                alert('Validation successful! Ready to send to server backend.');
                // Here you would typically perform an API fetch call to authenticate the user
            }
            
            return isValid;
        }

        function hello(e){
            
            e.preventDefault();
            const PRN=document.getElementById("PRN").value;
            const PRNerror=document.getElementById("PRNError");
            if(PRN.length<10){
                PRNerror.style.display="block";
                return false;
            }
            else{
                PRNerror.style.display="none";
                return true;
            }



        }
    </script>

</body>
</html>
